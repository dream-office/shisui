# 把构建产物发布到 GitHub Pages，给项目一个「点开就能用」的在线版本。
# 纯前端 + 本地存储，没有后端需要部署；vite 的 base 已设为相对路径，项目页子路径可直接工作。
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 准备 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 准备 Node.js
        uses: actions/setup-node@v5
        with:
          # pnpm 11 依赖 node:sqlite 内建模块，要求 Node >= 22.13
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建
        run: pnpm build

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 Pages
        id: deployment
        uses: actions/deploy-pages@v4
