# 在干净的 Ubuntu 环境里跑一遍完整的「clone 下来能不能用」流程：
# 装依赖 → 类型检查 → 单测 → 生产构建。
# 目的不是「有个 CI」，而是让可复现性从文档里的承诺变成每次推送都被机器验证的事实。
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 准备 pnpm
        uses: pnpm/action-setup@v4
        # 不写 version：版本以 package.json 的 packageManager 为唯一来源，
        # 两处都写会直接报 "Multiple versions of pnpm specified"

      - name: 准备 Node.js
        uses: actions/setup-node@v5
        with:
          # pnpm 11 依赖 node:sqlite 内建模块，要求 Node >= 22.13；钉 20 会在 pnpm 启动时直接崩
          node-version: 22
          cache: pnpm

      - name: 安装依赖（锁定版本）
        run: pnpm install --frozen-lockfile

      - name: 编码自查（防止 GBK 混入，推上去中文变乱码）
        run: python3 scripts/check-encoding.py

      - name: 类型检查
        run: pnpm typecheck

      - name: 单元测试（48 条，确定性）
        run: pnpm test

      - name: 生产构建
        run: pnpm build
